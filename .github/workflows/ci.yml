name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package Zip
        run: >
          powershell -NoProfile -Command
          "Compress-Archive -Path build\Release\zclip.exe,PAIRING.txt,README.md,LICENSE
          -DestinationPath zclip-windows-x64.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zclip-windows-x64.zip

  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Release Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zclip-windows-x64
          path: build/Release/zclip.exe
          if-no-files-found: error

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

  asan-test:
      name: AddressSanitizer (MSVC)
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4
        
        - name: Setup MSVC
          uses: ilammy/msvc-dev-cmd@v1
  
        - name: Configure CMake (ASan)
          # Natively use MSVC. /fsanitize=address enables ASan.
          # /Zi generates debug symbols for accurate stack traces.
          # /INCREMENTAL:NO is strictly required by MSVC for ASan to work.
          run: >
            cmake -B build-asan -S . 
            -DCMAKE_CXX_FLAGS="/fsanitize=address /Zi" 
            -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO" 
            -DCMAKE_BUILD_TYPE=Debug
  
        - name: Build
          run: cmake --build build-asan --config Debug
  
        - name: Test
          run: ctest --test-dir build-asan -C Debug --output-on-failure
