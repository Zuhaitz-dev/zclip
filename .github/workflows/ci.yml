name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers-test:
    name: ASan & UBSan (Clang-cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup LLVM & Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"

      - name: Configure CMake (Sanitizers)
        run: >
          cmake -B build-sanitizers -S . 
          -T ClangCL 
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g" 
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build-sanitizers --config Debug

      - name: Test
        run: ctest --test-dir build-sanitizers -C Debug --output-on-failure